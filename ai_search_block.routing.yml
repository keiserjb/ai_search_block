ai_search_block.api:
  path: '/ai-search-block/query'
  defaults:
    _controller: '\Drupal\ai_search_block\Controller\AiSearchBlockController::search'
    _title: 'Hello World'
  requirements:
    _permission: 'access content'

ai_search_block.db_results:
  path: '/ai-search-block/db-results'
  defaults:
    _controller: '\Drupal\ai_search_block\Controller\AiSearchBlockController::getDbResults'
    _title: 'Database Search Results'
  requirements:
    _access: 'TRUE'
  methods: [POST]
